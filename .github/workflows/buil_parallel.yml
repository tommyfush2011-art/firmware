        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-multilib libc6-dev-i386
          python -m pip install requests esptool intelhex platformio

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: ${{ runner.os }}-pio-esp32-s3-devkitc-1-psram-${{ hashFiles('platformio.ini', 'boards/**/*.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-esp32-s3-devkitc-1-psram-

      - name: Set firmware version
        run: |
          version="${GITHUB_SHA::7}"
          sed -i "s/-DBRUCE_VERSION=/-DBRUCE_VERSION='\"$version\"' ; /g" ./platformio.ini
          sed -i "s/-DGIT_COMMIT_HASH='\"Homebrew\"'/\!echo '-DGIT_COMMIT_HASH=\\\\\"'\$\(git describe --always --dirty)'\\\\\"'/g" ./platformio.ini

      - name: Compile Fush Firmware
        run: |
          set -o pipefail
          platformio run -e esp32-s3-devkitc-1-psram | tee build.log

      - name: Show build log on failure
        if: failure()
        run: tail -n 100 build.log || true

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: Fush-ESP32-S3-N16R8
          path: Bruce-*.*
          retention-days: 7
          if-no-files-found: error
