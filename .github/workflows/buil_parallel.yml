
name: Build Fush Firmware ESP32-S3

on:
  push:
    branches:
      - main
    paths:
      - "embedded_resources/**"
      - "patch.py"
      - "src/**"
      - "include/**"
      - "lib/**"
      - "boards/**"
      - "platformio.ini"
      - "platformio/**"
      - "scripts/**"
      - ".github/workflows/buil_parallel.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fush-firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build fush-s3-n16r8-rgb
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-multilib libc6-dev-i386
          python -m pip install --upgrade pip
          python -m pip install requests esptool intelhex platformio

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: ${{ runner.os }}-pio-fush-s3-n16r8-rgb-${{ hashFiles('platformio.ini', 'boards/**/*.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-fush-s3-n16r8-rgb-

      - name: Set firmware version
        run: |
          version="${GITHUB_SHA::7}"
          echo "Building Fush Firmware version: $version"
          sed -i "s/-DBRUCE_VERSION=/-DBRUCE_VERSION='\"$version\"' ; /g" ./platformio.ini

      - name: Compile Fush Firmware
        run: |
          set -o pipefail
          platformio run -e fush-s3-n16r8-rgb 2>&1 | tee build.log

      - name: Show build log on failure
        if: failure()
        run: |
          tail -n 100 build.log || true

      - name: Prepare firmware artifact
        run: |
          mkdir -p firmware-output

          find . -maxdepth 1 -type f -name "Bruce-*.bin" \
            -exec cp {} firmware-output/ \;

          if ! find firmware-output -name "*.bin" | grep -q .; then
            if [[ -f .pio/build/fush-s3-n16r8-rgb/firmware.bin ]]; then
              cp .pio/build/fush-s3-n16r8-rgb/firmware.bin firmware-output/fush-s3-n16r8-rgb-firmware.bin
            fi
          fi

          if ! find firmware-output -name "*.bin" | grep -q .; then
            echo "No Bruce firmware binary found."
            exit 1
          fi

          ls -lh firmware-output/

      - name: Upload Fush Firmware
        uses: actions/upload-artifact@v4
        with:
          name: Fush-ESP32-S3-N16R8-RGB
          path: firmware-output/*.bin
          retention-days: 7
          if-no-files-found: error
