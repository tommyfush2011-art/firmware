
name: Build Fush Firmware ESP32-S3

on:
  push:
    branches:
      - main
    paths:
      - "embedded_resources/**"
      - "patch.py"
      - "src/**"
      - "include/**"
      - "lib/**"
      - "boards/**"
      - "tools/**"
      - "platformio.ini"
      - "platformio/**"
      - "scripts/**"
      - ".github/workflows/buil_parallel.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fush-firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: fush-s3-n16r8-rgb
            artifact: Fush-ESP32-S3-N16R8-DEV
          - environment: fush-s3-n16r8-cam
            artifact: Fush-ESP32-S3-N16R8-CAM

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-multilib libc6-dev-i386
          python -m pip install --upgrade pip
          python -m pip install requests esptool intelhex platformio

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: ${{ runner.os }}-pio-${{ matrix.environment }}-${{ hashFiles('platformio.ini', 'boards/**/*.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-${{ matrix.environment }}-

      - name: Set firmware version
        run: |
          version="${GITHUB_SHA::7}"
          echo "Building Fush Firmware version: $version"
          sed -i "s/-DBRUCE_VERSION=/-DBRUCE_VERSION='\"$version\"' ; /g" ./platformio.ini

      - name: Verify build environment
        run: |
          platformio project config --lint
          grep -Fq "[env:${{ matrix.environment }}]" platformio.ini

      - name: Compile Fush Firmware
        run: |
          set -o pipefail
          platformio run -e "${{ matrix.environment }}" 2>&1 | tee build.log

      - name: Show build log on failure
        if: failure()
        run: |
          tail -n 100 build.log || true

      - name: Prepare firmware artifact
        shell: bash
        run: |
          mkdir -p firmware-output

          # Prefer the merged Bruce binary if the build creates one.
          shopt -s nullglob
          merged=(./Bruce-*.bin)

          if (( ${#merged[@]} > 0 )); then
            cp "${merged[0]}" firmware-output/
          else
            build_dir=".pio/build/${{ matrix.environment }}"
            test -f "$build_dir/firmware.bin"
            cp "$build_dir/firmware.bin" \
              "firmware-output/${{ matrix.environment }}-firmware.bin"
          fi

          ls -lh firmware-output/

      - name: Upload Fush Firmware
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: firmware-output/*.bin
          retention-days: 7
          if-no-files-found: error
